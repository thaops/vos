name: feature_clean_architecture
description: Generate a new feature following Clean Architecture pattern (Enterprise Edition v2.1)
version: 2.1.0

environment:
  mason: ">=0.1.0 <0.2.0"

vars:
  feature_name:
    type: string
    description: Name of the feature (e.g., login, profile, home, news)
    prompt: What is the feature name?
    default: new_feature

  model_name:
    type: string
    description: Name of the main domain model (e.g., user, product, article)
    prompt: What is the main domain model name?
    default: item

  usecase_definitions:
    type: list
    description: "Define usecases with return types. Format: usecase_name:returnType (e.g., get_news:List<Article>, get_detail:Article, create_item:void, update_item:bool, delete_item:bool)"
    prompt: "Enter usecase definitions (comma separated, format: name:type)"
    default:
      - get_items:List<Item>
      - get_item:Item

  has_local_storage:
    type: boolean
    description: Does this feature need local storage?
    prompt: Does this feature need local storage (Hive)?
    default: true

  has_remote_api:
    type: boolean
    description: Does this feature need remote API?
    prompt: Does this feature need remote API calls?
    default: true

  has_pagination:
    type: boolean
    description: Does this feature need pagination support?
    prompt: Does this feature need pagination?
    default: false

  has_search:
    type: boolean
    description: Does this feature need search functionality?
    prompt: Does this feature need search?
    default: false

  has_full_cache:
    type: boolean
    description: Cache all pages (not just page 1)?
    prompt: Do you want to cache all paginated pages?
    default: false

  api_base_path:
    type: string
    description: Base API path for this feature (e.g., /api/news, /api/users)
    prompt: What is the base API path?
    default: "/api/{{feature_name}}"

